# Intentionally failing workflow: npm ci will fail if package-lock.json is not present
name: CI Fail NPM
on:
  push:
    branches: [ 'head' ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install and test
        run: |
          echo "Running npm ci (will fail if package-lock.json is missing)"
          npm ci
