# Intentionally failing workflow: pip install will fail if requirements.txt is missing
name: CI Fail Py
on:
  push:
    branches: [ 'head' ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install requirements and run tests
        run: |
          echo "Attempting to install requirements and run pytest"
          pip install -r requirements.txt
          pytest -q
